workflows:
  ios-workflow:
    name: Reloop iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2

    # This is what actually resolves "No matching profiles found for
    # bundle identifier..." — Codemagic needs to know which App Store
    # Connect API key integration to use to fetch/generate signing files
    # automatically. Two things need to be true before this works:
    #   1. Codemagic dashboard → Team settings → Integrations →
    #      Developer Portal → Connect, providing an App Store Connect
    #      API key (Issuer ID + Key ID + the downloaded .p8 file) and
    #      giving that connection a NAME of your choosing.
    #   2. Replace REPLACE_WITH_YOUR_INTEGRATION_NAME below with
    #      whatever name you gave it in step 1 — it has to match exactly.
    integrations:
      app_store_connect: reloop-signing

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.malvin.reloop

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.malvin.reloop"
        # Once you've created the app listing in App Store Connect, its
        # numeric App ID goes here (App Store Connect → your app → General
        # → App Information → Apple ID) — add this var back in, along with
        # the "Increment build number" script step further down, once
        # you're actually at that stage. Leaving it out entirely for now,
        # since an empty placeholder isn't valid here.

      node: 22.11.0
      xcode: 16.2
      cocoapods: default

      # --- Firebase / Stripe secrets ---
      # These correspond exactly to .env.example, PLUS one more:
      # GOOGLE_SERVICE_INFO_PLIST_BASE64 — see the "Write GoogleService-Info.plist"
      # step below for what generates this value.
      # Set the real values as a Codemagic environment variable group
      # (Team settings → Environment variables → create a group, e.g. "reloop_secrets"), marking each one
      # "Secure" so it's encrypted at rest and never printed in build logs.
      # Then reference that group name below.
      groups:
        - reloop_secrets

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Write .env.local from Codemagic environment variables
        script: |
          cat > .env.local << EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_STRIPE_PUBLISHABLE_KEY=$VITE_STRIPE_PUBLISHABLE_KEY
          EOF

      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Write GoogleService-Info.plist from secure variable
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST_BASE64 | base64 -d > ios/App/App/GoogleService-Info.plist

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          xcode-project use-profiles

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

# No "publishing:" block yet — Codemagic doesn't allow that key to exist
# with everything under it commented out (which is what caused the original
# validation error). Add it back once GoogleService-Info.plist, the URL
# scheme, and code signing are all confirmed working end to end — something
# like:
#
#   publishing:
#     app_store_connect:
#       auth: integration
#       submit_to_testflight: true
