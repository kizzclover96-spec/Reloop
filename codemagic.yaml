workflows:
  ios-workflow:
    name: Reloop iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # --- Code signing ---
      # Nothing here works until you've enrolled in the Apple Developer
      # Program ($99/year) and connected it to Codemagic:
      #   Codemagic dashboard → Team settings → Integrations → App Store Connect
      # Once that's done, replace "CodeMagic" below with whatever name you
      # gave that integration, and Codemagic can auto-manage certificates
      # and provisioning profiles for you — no manual .p12/.mobileprovision
      # wrangling needed.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.malvin.reloop

      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # Found in App Store Connect → your app → General → App Information
        # → Apple ID, once you've created the app listing there. Leave
        # blank until then — only needed for the auto-publish step at the
        # bottom of this file.
        APP_STORE_APP_ID: ""

      node: 20.19.0
      xcode: 16.2
      cocoapods: default

      # --- Firebase / Stripe secrets ---
      # These correspond exactly to .env.example. Set the real values as
      # a Codemagic environment variable group (Team settings → Environment
      # variables → create a group, e.g. "reloop_secrets"), marking each one
      # "Secure" so it's encrypted at rest and never printed in build logs.
      # Then reference that group name below.
      groups:
        - reloop_secrets

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Write .env.local from Codemagic environment variables
        script: |
          cat > .env.local << EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_STRIPE_PUBLISHABLE_KEY=$VITE_STRIPE_PUBLISHABLE_KEY
          EOF

      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID") + 1))

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Uncomment once GoogleService-Info.plist, the URL scheme, and code
      # signing are all actually working end to end — no point auto-pushing
      # to TestFlight before a build has been confirmed to even launch.
      # email:
      #   recipients:
      #     - you@example.com
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
